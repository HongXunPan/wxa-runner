name: 同步上游并验证合入

# 控制代码来自 main；候选代码只进入隔离的只读 CI，不继承写令牌或 secrets。
on:
  schedule:
    # UTC 00:17，即北京时间每天 08:17，实际执行时间可能延迟。
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-main-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'HongXunPan/wxa-runner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      eligible: ${{ steps.candidate.outputs.eligible }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      upstream_sha: ${{ steps.candidate.outputs.upstream_sha }}
      branch: ${{ steps.candidate.outputs.branch }}
      pr_number: ${{ steps.candidate.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 准备候选与安全分类
        id: candidate
        run: node scripts/upstream-sync.mjs prepare

  pending:
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      SYNC_BRANCH: ${{ needs.prepare.outputs.branch }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/upstream-sync.mjs pending

  verify:
    needs: [prepare, pending]
    if: needs.prepare.outputs.eligible == 'true'
    permissions:
      contents: read
    # 同仓相对路径固定使用本次 main 工作流版本，不使用候选分支的 CI 定义。
    uses: ./.github/workflows/ci.yml
    with:
      candidate-sha: ${{ needs.prepare.outputs.candidate_sha }}
      base-sha: ${{ needs.prepare.outputs.base_sha }}
      head-branch: ${{ needs.prepare.outputs.branch }}

  finish:
    needs: [prepare, pending, verify]
    if: always() && !cancelled() && needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      statuses: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
      UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
      SYNC_BRANCH: ${{ needs.prepare.outputs.branch }}
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
      CI_RESULT: ${{ needs.verify.result }}
      PENDING_RESULT: ${{ needs.pending.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 回写结果并安全快进已验证提交
        run: node scripts/upstream-sync.mjs finish
